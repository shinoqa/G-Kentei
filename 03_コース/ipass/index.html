<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IP STUDY DAILY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ITパスポート試験に向けて、毎日20問。IPA公開問題とシラバスに沿ったテキストつき。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 1カラムの学習アプリ。上にブランド行、中身はカード少なめ、下に固定ナビ。TANKUブランド標準トークン */
:root{
  --navy:#0A1B3D; --teal:#00B7C3; --teal-ink:#007E91; --yellow:#FFC83D; --coral:#FF5A6E;
  --pale:#E6F2FF; --bg:#FFFFFF; --ground:#F5F9FF; --line:#D7E5F4; --muted:#596B87;
  --ok:#0B8A6B; --ok-bg:#E3F6F0; --ng:#C23A4E; --ng-bg:#FFE9EC; --shadow:0 1px 2px rgba(10,27,61,.06);
  --jp:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
  --en:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#E8F1FB; --teal:#2FD3DE; --teal-ink:#2FD3DE; --yellow:#FFD166; --coral:#FF7C8C;
  --pale:#0E2440; --bg:#071426; --ground:#0A1B33; --line:#1C3556; --muted:#93A8C6;
  --ok:#4FD1A8; --ok-bg:#0D3229; --ng:#FF8C9C; --ng-bg:#3A1621; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#E8F1FB; --teal:#2FD3DE; --teal-ink:#2FD3DE; --yellow:#FFD166; --coral:#FF7C8C;
  --pale:#0E2440; --bg:#071426; --ground:#0A1B33; --line:#1C3556; --muted:#93A8C6;
  --ok:#4FD1A8; --ok-bg:#0D3229; --ng:#FF8C9C; --ng-bg:#3A1621; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--navy);font:15px/1.75 var(--jp);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;padding:10px 16px}
button:hover{border-color:var(--teal)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(24px,5vw,32px);line-height:1.35;font-weight:900;text-wrap:balance}
h2{font-size:18px;font-weight:700;text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--en);font-weight:800;letter-spacing:.14em;font-size:15px}
.brand i{font-style:normal;color:var(--teal);font-size:11px;letter-spacing:.2em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:auto;padding:4px 10px;border-radius:99px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)} .sync.err::before{background:var(--coral)}
.label{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.muted{color:var(--muted)} .tiny{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{padding-block:14px 6px;display:flex;flex-direction:column;gap:6px}
.count{font-family:var(--en);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count small{font-family:var(--jp);font-size:14px;font-weight:700;margin-left:4px}
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px}
.ring text{font-family:var(--en);font-weight:800;fill:var(--navy)}
.cta{background:var(--navy);color:var(--bg);border-color:var(--navy);font-weight:700;font-size:16px;min-height:54px;width:100%}
.cta:hover{border-color:var(--teal);background:var(--navy)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>button{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--pale);color:var(--navy);white-space:nowrap}
.chip.text{background:color-mix(in srgb,var(--teal) 18%,var(--bg))}
.chip.drill{background:color-mix(in srgb,var(--yellow) 30%,var(--bg))}
.chip.weak{background:var(--ng-bg);color:var(--ng)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.bar b{font-weight:700;font-size:14px}
.bar span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--pale);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--teal)} .track .s{background:color-mix(in srgb,var(--teal) 35%,var(--pale))}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 出題画面 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:14px 4px}
.qhead button{min-height:40px;padding:6px 14px}
.prog{height:4px;background:var(--pale);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prompt{font-size:17px;font-weight:500;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:14px;line-height:1.65;font-size:15px}
.opt .k{font-family:var(--en);font-weight:800;color:var(--teal-ink);font-size:14px;padding-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)} .opt.wrong .k{color:var(--ng)}
.opt:disabled{cursor:default;opacity:1}
.verdict{font-weight:900;font-size:20px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{white-space:pre-wrap}
.ai{border-left:3px solid var(--teal);padding:4px 0 4px 14px;white-space:pre-wrap}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-block:10px}
/* 表 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td button{min-height:34px;padding:4px 10px;font-size:12.5px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.wl{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wl button{text-align:left;min-height:auto;display:flex;flex-direction:column;gap:2px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{font-family:var(--en);font-size:10px;fill:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.danger{color:var(--ng);border-color:var(--ng)}
/* ナビ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;white-space:nowrap;font-weight:700;min-height:64px;padding:8px 4px;color:var(--muted)}
nav button[aria-current="page"]{color:var(--navy)}
nav svg{width:24px;height:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
/* テキスト */
.toc{display:flex;flex-direction:column;gap:6px}
.toc button{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;text-align:left;min-height:52px;padding:8px 12px}
.toc .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--bg)}
.toc .done .ck{background:var(--teal);border-color:var(--teal)}
.toc .tt{display:flex;flex-direction:column;min-width:0}
.prose{gap:10px;font-size:15.5px;line-height:1.9}
.prose h3{font-size:16.5px;font-weight:900;margin:10px 0 0;padding-left:10px;border-left:4px solid var(--teal);line-height:1.5}
.prose h3:first-child{margin-top:0}
.prose p{margin:0}
ul.tx{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
ul.tx li.sub{list-style:circle;margin-left:1.2em}
.co{border-radius:12px;padding:10px 14px;background:var(--pale)}
.co b{display:block;font-size:12px;letter-spacing:.06em;color:var(--teal-ink)}
.co-pt{background:color-mix(in srgb,var(--yellow) 22%,var(--bg))}
.co-pt b{color:var(--navy)}
.co-wk{background:color-mix(in srgb,var(--teal) 12%,var(--bg))}
.co-nt{background:var(--ng-bg)} .co-nt b{color:var(--ng)}
button.tl{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted var(--teal-ink) 2px;text-underline-offset:4px}
button.tl:focus-visible{outline:3px solid var(--yellow);outline-offset:1px;border-radius:2px}
.syl{display:flex;flex-direction:column;gap:6px}
.syl button{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;text-align:left;min-height:auto;padding:10px 12px;line-height:1.6}
.syl .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--bg);margin-top:2px}
.syl button[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--bg))}
.syl button[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal)}
button[aria-pressed="true"]{border-color:var(--teal)}
.rel{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.rel .row button{flex:0 1 auto;min-height:38px;padding:6px 12px;font-size:13.5px}
/* 用語集 */
#gq{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 14px;width:100%}
#gq:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.chips{gap:6px}
.chips button{flex:0 0 auto;min-height:36px;padding:4px 12px;font-size:13px;border-radius:99px}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
details.gl{border-bottom:1px solid var(--line);padding:8px 0}
details.gl summary{list-style:none;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-weight:400}
details.gl summary::-webkit-details-marker{display:none}
details.gl summary b{font-weight:700}
.gd{flex-basis:100%;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.gl[open] .gd{display:none}
details.gl .term h3{display:none}
.term{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px}
.term h3{font-size:19px;font-weight:900}
dialog#term{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--navy);padding:18px 20px;width:min(560px,calc(100% - 32px));max-height:80vh}
dialog#term::backdrop{background:rgba(10,27,61,.45)}
dialog#term .dtop{display:flex;justify-content:flex-end}
dialog#term .dtop button{min-height:36px;padding:4px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">IP STUDY <i>DAILY</i></div>
    <span class="sync" id="sync">この端末に保存</span>
  </header>
  <main id="main" class="stack">
    <section class="panel"><p class="label">Loading</p><p>問題を読み込んでいます。</p></section>
  </main>
</div>
<nav aria-label="メインメニュー"><div class="in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="15" width="7" height="7" rx="1.6" fill="currentColor"/><rect x="8.5" y="8.5" width="7" height="7" rx="1.6" fill="var(--teal)"/><rect x="15" y="2" width="7" height="7" rx="1.6" fill="var(--teal)"/></svg>今日の学習</button>
  <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 7C6 1 19 1 19 8C19 13 12 10 12 16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="10.5" y="19" width="3" height="3" rx=".8" fill="var(--teal)"/></svg>復習</button>
  <button data-tab="text"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 5c3-1.5 6-1.5 9 .5v15c-3-2-6-2-9-.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M21 5c-3-1.5-6-1.5-9 .5v15c3-2 6-2 9-.5z" fill="var(--teal)"/></svg>テキスト</button>
  <button data-tab="gloss"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="13" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 8h5M7 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="17" r="4" fill="var(--teal)"/><path d="M20 20l2 2" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round"/></svg>用語</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="13" width="4" height="8" rx="1" fill="currentColor"/><rect x="10" y="8" width="4" height="13" rx="1" fill="var(--teal)"/><rect x="17" y="3" width="4" height="18" rx="1" fill="var(--teal)"/></svg>記録</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5H20M4 12H20M4 19H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="7" y="2" width="4" height="6" rx="1" fill="var(--teal)"/><rect x="15" y="9" width="4" height="6" rx="1" fill="var(--teal)"/><rect x="6" y="16" width="4" height="6" rx="1" fill="var(--teal)"/></svg>設定</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="term" aria-label="用語の説明"><div class="dtop"><button data-act="close-term">閉じる</button></div><div id="termBody"></div></dialog>
<script src="course.js"></script>
<script src="text_intro.js"></script>
<script src="text_strategy.js"></script>
<script src="text_management.js"></script>
<script src="text_technology.js"></script>
<script src="glossary_1.js"></script>
<script src="syllabus.js"></script>
<script src="app.js"></script>

</body></html>
